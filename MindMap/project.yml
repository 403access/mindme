name: MindMap
options:
  bundleIdPrefix: dev.oliver
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MindMapCore:
    path: Core
targets:
  MindMap:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: MindMapCore
        product: MindMapCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.oliver.mindme
        PRODUCT_NAME: MINDME
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: MINDME
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_EMIT_LOC_STRINGS: NO
        COMBINE_HIDPI_IMAGES: YES
  MindMapIOS:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: MindMapCore
        product: MindMapCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.oliver.mindme
        PRODUCT_NAME: MINDME
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: MINDME
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: NO
  MindMapTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App
        excludes:
          - MindMapApp.swift
      - path: Tests/App
    dependencies:
      - package: MindMapCore
        product: MindMapCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.oliver.mindme.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
schemes:
  MindMap:
    build:
      targets:
        MindMap: all
        MindMapTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MindMapTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  MindMapIOS:
    build:
      targets:
        MindMapIOS: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
