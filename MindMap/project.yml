name: MindMap
options:
  bundleIdPrefix: dev.oliver
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  MindMapCore:
    path: Core
targets:
  MindMap:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: MindMapCore
        product: MindMapCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.oliver.mindme
        PRODUCT_NAME: MINDME
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: MINDME
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_EMIT_LOC_STRINGS: NO
        COMBINE_HIDPI_IMAGES: YES
