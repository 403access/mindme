name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'spatial/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            spatial/package-lock.json

      - name: Install docs dependencies
        working-directory: website
        run: npm ci

      - name: Build docs site
        working-directory: website
        run: npm run build

      - name: Install spatial dependencies
        working-directory: spatial
        run: npm ci

      - name: Check spatial data layer
        working-directory: spatial
        run: npm run check

      - name: Build spatial app
        working-directory: spatial
        run: npm run build -- --base=/mindme/quest/

      - name: Publish spatial app under /quest/
        run: |
          mkdir -p website/build/quest
          cp -R spatial/dist/. website/build/quest/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
